# Render Blueprint — New → Blueprint → select this repo.
# Uses Render's free plans (free web service sleeps when idle; free Postgres expires after 30 days).
databases:
  - name: settle-db
    plan: free
    region: oregon
    databaseName: settle
    user: settle

services:
  - type: web
    name: settle
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: settle-db
          property: connectionString
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_CLIENT_PAYPAL_EMAIL
        sync: false
      - key: DEMO_FREELANCER_PAYPAL_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: PLATFORM_FEE_PCT
        value: "3"
      - key: AUTO_APPROVE_HOURS
        value: "48"
